# thresholds.conf — Configuration des seuils d'alerte et du canal de notification.
#
# Ce fichier est « sourcé » tel quel par monitor.sh : il s'agit donc de
# variables shell valides (PAS d'espaces autour du signe =). Les lignes
# commençant par # sont des commentaires.
#
# Astuce : copiez ce fichier et passez votre copie via --config /chemin/fichier
# pour conserver plusieurs profils (serveur web, base de données, etc.).

# ---------------------------------------------------------------------------
# Seuils d'utilisation (en pourcentage, 0–100)
# ---------------------------------------------------------------------------
# Au-delà de WARN, une alerte d'avertissement est émise.
# Au-delà de CRIT, une alerte critique est émise (priorité supérieure).

# CPU global
CPU_WARN=80
CPU_CRIT=90

# Mémoire (RAM)
MEM_WARN=80
MEM_CRIT=90

# Disque (appliqué à CHAQUE point de montage)
DISK_WARN=80
DISK_CRIT=90

# ---------------------------------------------------------------------------
# Charge système (load average sur 1 minute)
# ---------------------------------------------------------------------------
# La charge est relativisée au nombre de cœurs. Le seuil exprime un ratio
# « charge / nombre de cœurs ». Exemple : 1.0 => alerte si la charge 1 min
# dépasse le nombre de cœurs (machine saturée) ; 2.0 => deux fois saturée.
LOAD_WARN_RATIO=1.0
LOAD_CRIT_RATIO=2.0

# ---------------------------------------------------------------------------
# Canal d'alerte
# ---------------------------------------------------------------------------
# Fichier où sont journalisées toutes les alertes (créé automatiquement).
ALERT_LOG_FILE="/var/log/surveillance-systeme/alerts.log"

# URL du webhook de notification (Slack, Discord, Mattermost, n'importe quel
# endpoint acceptant un POST JSON). LAISSER VIDE pour activer le MODE DÉMO :
# aucune connexion réseau ne sera tentée, le payload est simplement affiché.
ALERT_WEBHOOK_URL=""

# Délai maximal (secondes) accordé à l'appel curl du webhook.
ALERT_WEBHOOK_TIMEOUT=5

# Forcer le mode démo même si une URL de webhook est renseignée (1 = oui).
# Pratique pour tester la chaîne sans réellement notifier le canal.
ALERT_DEMO_MODE=0
